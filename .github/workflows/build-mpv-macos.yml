name: Build self-contained arm64 mpv (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Install mpv + dylibbundler
        run: brew install mpv dylibbundler

      - name: Bundle self-contained arm64 mpv
        run: |
          set -e
          MPV="$(which mpv)"
          echo "mpv: $MPV"
          file "$MPV"
          lipo -archs "$MPV"
          mkdir -p bundle
          cp "$MPV" bundle/mpv
          dylibbundler -cd -b -x bundle/mpv -d bundle/libs
          codesign -fs - bundle/mpv
          for f in bundle/libs/*.dylib; do codesign -fs - "$f"; done
          echo "=== verify ==="
          file bundle/mpv
          lipo -archs bundle/mpv
          otool -L bundle/mpv
          tar -czf mpv-arm64.tar.gz -C bundle .

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-arm64
          path: mpv-arm64.tar.gz
