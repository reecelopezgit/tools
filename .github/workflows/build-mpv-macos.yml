name: Build self-contained arm64 mpv (macOS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Install MPV + DASH-enabled FFmpeg
        run: |
          set -e
          brew tap homebrew-ffmpeg/ffmpeg
          brew install mpv dylibbundler
          # Homebrew/core's FFmpeg omits the MPEG-DASH demuxer. Keep the MPV
          # executable, then replace its FFmpeg runtime with the same-version
          # full build that enables DASH and libxml2.
          brew uninstall --ignore-dependencies ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-libxml2
          ffmpeg -demuxers | grep -E '^[[:space:]]*D[[:space:]]+dash[[:space:]]'

      - name: Bundle self-contained arm64 mpv
        run: |
          set -e
          MPV="$(which mpv)"
          echo "mpv: $MPV"
          file "$MPV"
          lipo -archs "$MPV"
          mkdir -p bundle
          cp "$MPV" bundle/mpv
          dylibbundler -cd -b -x bundle/mpv -d bundle/libs
          # Verify the bundled libavformat registers the MPEG-DASH demuxer,
          # not only FFmpeg's unrelated WebM DASH manifest handler.
          printf '%s\n' '<MPD xmlns="urn:mpeg:DASH:schema:MPD:2011" type="static"><Period/></MPD>' > dash-probe.mpd
          set +e
          bundle/mpv --no-config --vo=null --ao=null --demuxer-lavf-format=dash dash-probe.mpd > dash-probe.log 2>&1
          probe_status=$?
          set -e
          if grep -q 'Unknown lavf format dash' dash-probe.log; then
            cat dash-probe.log
            echo 'Bundled MPV does not contain the MPEG-DASH demuxer.' >&2
            exit 1
          fi
          echo "DASH demuxer probe exited $probe_status after recognizing the format (expected for the intentionally incomplete MPD)."
          codesign -fs - bundle/mpv
          for f in bundle/libs/*.dylib; do codesign -fs - "$f"; done
          echo "=== verify ==="
          file bundle/mpv
          lipo -archs bundle/mpv
          otool -L bundle/mpv
          tar -czf mpv-arm64.tar.gz -C bundle .

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-arm64
          path: mpv-arm64.tar.gz
